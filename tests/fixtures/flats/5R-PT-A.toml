# Typology test fixture: snapshot of config/flats/5R-PT-A.toml taken 2026-10-04 (PT4 point block tests).
# 5-room flat for point blocks: galley kitchen along the core, yard and third bedroom on the re-entrant slot,
# living/dining through the middle to the rear facade, bedroom wing (bedroom 2, master suite with walk-in
# wardrobe) on the end facade.
# Frame: x from the core side (0) to the end facade, y from the lift lobby (0) to the rear facade.
id = "5R-PT-A"
type = "5R"
title = "5-room, point block quadrant (slot kitchen, end-facade bedroom wing)"
fits = ["PT"]
shelter_wall = "HS250"
notes = "Kitchen windows onto the lift lobby; the yard and bedroom 3 open onto the slot between quadrants (above the stair core). A hall off the living serves bedroom 2, the common bath and the master suite (walk-in wardrobe to the en-suite). No study: larger living/dining."

x = [0.0, 2.4, 3.4, 4.4, 6.4, 7.0, 8.2, 9.4, 11.2]
y = [0.0, 2.4, 4.0, 5.6, 6.6, 7.0, 10.2]
