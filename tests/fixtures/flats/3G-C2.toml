# 3Gen flat for the corner of an L-block (corridor access, one gable facade), the alternative to 3G-C. The
# grandparents' suite (bedroom 4 + en-suite) takes the quiet rear corner by the party wall, off a short hall shared
# with bedroom 3 (corridor); the kitchen sits in the middle of the gable behind its yard; bedroom 2 takes the
# corridor/gable corner and the master suite the rear/gable corner. The foyer and the dining/living run from the
# corridor to the rear between them.
# Frame: x along the corridor (x = 0 party wall, x = W the outside gable), y from the corridor (0) to the rear facade.
id = "3G-C2"
type = "3G"
title = "3Gen, L-block corner unit (grandparents' suite at the rear, kitchen on the gable)"
fits = ["LC"]
shelter_wall = "HS250"
notes = "Same 12.0 x 10.0 m envelope as 3G-C, so the L-block corner geometry is unchanged. Not mirrored inside the template: the gable (x = W) carries bedroom 2, the yard, the master bath vent and the master windows, so a mirrored corner unit is produced by the block placement instead. The kitchen is lit and aired through the yard (or open to the dining); the grandparents' bath is mechanically ventilated, the common bath vents onto the corridor and the shelter opens out into the foyer."

x = [0.0, 1.6, 3.4, 5.0, 6.6, 8.2, 8.4, 10.2, 10.6, 12.0]
y = [0.0, 2.4, 3.0, 3.4, 5.4, 6.0, 7.0, 10.0]
open = [["F", "LD"], ["LD", "H"]]

