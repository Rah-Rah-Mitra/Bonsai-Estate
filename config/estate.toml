# Sample Town N5 - HDB neighbourhood masterplan (about 400 x 400 m, 1,206 flats in 12 blocks + MSCP + NC).
# Local estate frame: metres, origin at the south-west corner, +x east, +y north, z = 0 at finished ground.
# Block positions ("at") are the block-local origin in estate coordinates; "rot" is in quarter turns (0..3, CCW).

[estate]
name = "Sample Town N5"
code = "SN5"
seed = 20261004
schema = "IFC4X3"
ifc4_copy = true
extent = [0.0, 0.0, 400.0, 400.0]
street = "Sample Town N5"

[georef]                       # SVY21 placeholders (no real site)
epsg = 3414
eastings = 30000.0
northings = 36000.0
height = 15.0
true_north_deg = 0.0

[agent]
radius = 0.30
height = 1.80
step = 0.40
voxel = 0.10
ramp_max = 0.0833

[budget]
max_ifc_elements_per_file = 25000
max_openings_per_wall = 20

# ----------------------------------------------------------------------------- roads (centreline, reserve width)
[[road]]
