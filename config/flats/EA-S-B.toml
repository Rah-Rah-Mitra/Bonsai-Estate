# Executive apartment for corridor slab blocks, deep plan: a long living/dining along one party wall (dining
# next to the entrance and the eat-in kitchen, living at the rear behind a bay window), a gallery hall off the
# foyer that turns into a private corridor to the master suite (walk-in wardrobe, bay window) at the other rear corner.
# Bay windows are modelled as ledges (counted in the floor area, as in the 1990s executive flats).
# Frame: x along the corridor (both sides party walls in mid units), y from the corridor (0) to the rear facade.
id = "EA-S-B"
type = "EA"
title = "Executive, corridor slab (deep living with bay windows, master wing)"
fits = ["SL"]
shelter_wall = "HS250"
notes = "Different from EA-S-A: no study or balcony, a 4.6 m wide living/dining running 8.8 m deep, kitchen in the middle bay opening to the dining, master suite reached by its own hall. The 'ac_ledge' outdoor variant carries the two bay-window ledges; 'none' gives flush windows. Master bath mechanically ventilated."

x = [0.0, 3.4, 4.6, 5.0, 7.0, 7.2, 8.6, 10.6]
