# 5-room flat for L-block wings (corridor access): a wide, shallow plan. Foyer and shelter at one corridor
# corner open into a side living/dining that runs to the rear (balcony variant); a cross hall serves two
# corridor bedrooms, the common bath and the master suite; eat-in kitchen in the centre with the yard and
# the master bath behind it on the rear facade.
# Frame: x along the corridor (both sides party walls in mid units), y from the corridor (0) to the rear facade.
id = "5R-L"
type = "5R"
title = "5-room, L-block wing (side living, central kitchen, balcony option)"
fits = ["SL"]
shelter_wall = "HS250"
notes = "Different from 5R-S-A: side living/dining instead of a central one, cross hall, kitchen in the middle bay, master bath on the rear facade (common bath mechanically ventilated). The living/dining width is fixed so the balcony door and the living window always fit; stretch is taken by the bathroom, hall and yard bays."

x = [0.0, 2.0, 3.4, 5.2, 7.0, 9.4, 11.2]
y = [0.0, 2.6, 3.6, 5.0, 5.8, 8.4, 10.2]
