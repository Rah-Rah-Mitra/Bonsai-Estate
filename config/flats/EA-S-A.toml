# Executive apartment for corridor slab blocks: a wide plan with a study off the foyer, two corridor bedrooms,
# a central dining that opens to a 5 m wide rear living (balcony across it in the default-friendly variant),
# master suite with walk-in wardrobe at one rear corner, eat-in kitchen, utility room and yard at the other.
# Frame: x along the corridor (both sides party walls in mid units), y from the corridor (0) to the rear facade.
id = "EA-S-A"
type = "EA"
title = "Executive, corridor slab (study, wide rear living with balcony)"
fits = ["SL"]
shelter_wall = "HS250"
notes = "Balcony listed first so seeded picks favour it; the living keeps a full-height window beside the balcony door so its glazing holds in every outdoor variant. Master bath (off the walk-in wardrobe) is mechanically ventilated; the common bath vents onto the corridor."

x = [0.0, 2.0, 3.2, 3.4, 4.0, 4.6, 6.2, 6.6, 8.4, 9.0, 9.8, 11.6]
