# 3Gen flat for the corner of an L-block (corridor access, one gable facade). The grandparents' suite
# (bedroom 4 + en-suite) sits next to the entrance on the corridor; kitchen and yard take the corridor/gable
# corner; bedroom 2 and the master suite line the gable; the living/dining is the hub and opens to the rear.
# Frame: x along the corridor (x = 0 party wall, x = W the outside gable), y from the corridor (0) to the rear facade.
id = "3G-C"
type = "3G"
title = "3Gen, L-block corner unit (grandparents' suite at the entrance)"
fits = ["LC"]
shelter_wall = "HS250"
notes = "Not mirrored inside the template: the gable (x = W) carries the yard, bedroom 2 and master windows, so a mirrored corner unit is produced by the block placement instead. Master bath mechanically ventilated; bedroom 4 bath and the common bath vent onto the corridor."

x = [0.0, 1.6, 2.0, 3.2, 4.8, 6.6, 6.8, 8.0, 8.4, 9.2, 10.6, 12.0]
y = [0.0, 2.4, 3.0, 3.4, 5.4, 6.4, 6.8, 8.2, 10.0]
