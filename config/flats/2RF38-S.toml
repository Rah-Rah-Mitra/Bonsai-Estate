# 2-room Flexi (~38 m2 IFA) for corridor slab blocks: open living/dining/kitchen along one party wall,
# bathroom + household shelter + short hall at the corridor side, bedroom on the quiet rear facade.
# Frame: x along the corridor (both sides are party walls in a mid unit), y from the corridor (0) to the rear facade.
id = "2RF38-S"
type = "2RF"
title = "2-room Flexi 38, slab (open LDK, bath on the corridor)"
fits = ["SL"]
shelter_wall = "HS250"
notes = "Compact 2RF: the entry opens straight into the LDK with the kitchen run on the corridor window; bath and bedroom are reached from a 1.2 m hall; the shelter door opens out into the LDK beside the entry."

x = [0.0, 1.5, 3.1, 6.2]
y = [0.0, 1.6, 2.8, 6.4]
open = [["H", "LDK"]]

[rooms]
BA = [[0.0, 0.0, 1.5, 2.8]]
HS = [[1.5, 0.0, 3.1, 1.6]]
H = [[1.5, 1.6, 3.1, 2.8]]
BED = [[0.0, 2.8, 3.1, 6.4]]
LDK = [[3.1, 0.0, 6.2, 6.4]]

[[doors]]
