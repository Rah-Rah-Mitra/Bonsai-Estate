# 3-room flat for corridor slab blocks, "galley kitchen": a galley kitchen along one party wall runs from behind the
# common bath to the service yard on the rear facade; the foyer opens into a living/dining that reaches the rear
# facade; bedroom 2 (corridor, high window) and the master bedroom (rear, en-suite in the rear corner) open off the
# living along the other party wall; the shelter sits on the corridor between the foyer and bedroom 2.
# Frame: x along the corridor (both sides are party walls in a mid unit), y from the corridor (0) to the rear facade.
id = "3R-S-A"
type = "3R"
title = "3-room, slab (galley kitchen and yard on the party wall, bedrooms off the living)"
fits = ["SL"]
shelter_wall = "HS250"
notes = "Common bath on the corridor (vent window); kitchen lit and aired through the yard (or open to the living); the shelter door opens out into the living; the master bath vents onto the rear facade."

x = [0.0, 1.8, 3.4, 5.2, 6.6, 8.2]
y = [0.0, 2.0, 3.3, 6.6, 8.4]
