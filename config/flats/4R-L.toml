# 4-room flat for L-block wings: bedroom 2 takes the corridor corner (high window) off the dining, a galley kitchen
# runs along that party wall to the service yard on the rear facade, the living/dining fills the middle and the rear
# beside it (balcony option), and the master suite takes the other rear corner: an L-shaped bedroom wrapped around
# its en-suite, which vents to the rear. Bedroom 3 (corridor), the common bath and the master bedroom open off a
# short hall; the foyer opens into the dining.
# Frame: x along the common corridor (both sides party walls in a mid unit), y from the corridor (0) to the rear facade.
id = "4R-L"
type = "4R"
title = "4-room, L-block wing (galley kitchen, rear master suite, balcony option)"
fits = ["SL"]
shelter_wall = "HS250"
notes = "Different from the slab 4-rooms: the kitchen is a galley on one party wall lit and aired through the rear yard (or open to the dining), bedroom 2 opens off the dining, and the master bedroom wraps around its en-suite in the other rear corner (master bath vents to the rear, common bath mechanically vented). Bedrooms 2 and 3 take high windows on the corridor; the shelter opens out into the dining. The balcony variant spans the rear of the living (the living window then opens onto it) and replaces the dining window with the balcony door."

x = [0.0, 1.8, 3.6, 5.2, 5.6, 7.0, 8.6, 10.2]
y = [0.0, 2.4, 3.4, 5.6, 7.6, 9.4]
