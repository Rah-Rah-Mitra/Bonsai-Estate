# 3-room flat for point-block quadrants: living/dining as the hub in the middle of the flat, reaching both the end
# facade and the rear; kitchen + service yard on the end facade next to the lobby; bedroom 2 on the lobby beside the
# core (high window), master bedroom in the rear corner by the core slot; both bathrooms ventilate to the rear.
# Frame: x from the core side (0) to the end facade, y from the lift lobby (0) to the rear facade.
id = "3R-PT-A"
type = "3R"
title = "3-room, point block quadrant (central living, baths on the rear facade)"
fits = ["PT"]
shelter_wall = "HS250"
notes = "Bedrooms open straight off the living room (no hall); the master bedroom gets a second window onto the slot beyond the core (y > 5.8, clear of the stair enclosure)."

x = [0.0, 3.2, 4.8, 6.2, 6.4, 7.4, 9.0]
y = [0.0, 2.0, 2.4, 3.4, 3.8, 5.8, 7.6]
open = [["F", "LD"]]

